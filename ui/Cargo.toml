[package]
name = "mlm-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# the app only runs in the browser; natively the crate builds just for `cargo test -p mlm-ui`
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AbortController", "AbortSignal", "AudioContext", "AudioContextOptions", "AudioContextState",
  "AudioDestinationNode", "AudioNode", "AudioWorklet", "AudioWorkletNode", "AudioWorkletNodeOptions", "BaseAudioContext",
  "Blob", "Cache", "CacheStorage", "console", "Document", "Event", "EventTarget", "File", "FilePropertyBag", "HtmlAudioElement", "HtmlMediaElement",
  "KeyboardEvent", "MediaImage", "MediaMetadata", "MediaMetadataInit", "MediaPositionState", "MediaQueryList", "MediaSession",
  "MediaSessionAction", "MediaSessionActionDetails", "MediaSessionPlaybackState", "MediaStream", "MediaStreamAudioDestinationNode", "Navigator", "Performance", "ShareData", "Storage", "StorageManager", "Headers", "Element", "HtmlAnchorElement", "HtmlElement", "HtmlCanvasElement", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit",
  "Response", "Window", "Worklet",
] }
